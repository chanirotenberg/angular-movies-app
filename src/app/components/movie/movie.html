<!-- <p>movie works!</p> -->
<div *ngIf="movie" class="movie-container"
    [ngStyle]="{border: movie.rating > 8 ? '2px solid green' : '2px solid red' }"
    [ngClass]="{'good-movie': movie.rating > 8}">
    <span [ngSwitch]="movie.type">
        <p *ngSwitchCase="movieTypeEnum.Action">
            Action
        </p>
        <p *ngSwitchCase="movieTypeEnum.Drama">
            Drama
        </p>
        <p *ngSwitchDefault>
            Movie Error
        </p>
    </span>
    <h1>{{movie.name|uppercase}} </h1>
    <p>Main Character: {{movie.mainCharacter}}</p>
    <p>Rating: {{movie.rating}}</p>
    <p>Release Date: {{movie.releaseDate|date}}</p>
</div>
